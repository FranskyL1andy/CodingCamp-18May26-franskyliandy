<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="To-Do List Life Dashboard — personal productivity homepage" />
  <title>To-Do Life Dashboard</title>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

  <!-- Top bar: app title + theme toggle -->
  <header id="app-topbar">
    <span class="app-title">📋 To-Do Life Dashboard</span>
    <button id="theme-toggle" type="button" aria-label="Switch to light mode">☀ Light</button>
  </header>

  <!-- Storage unavailability warning banner (hidden by default) -->
  <div id="app-banner" role="alert"></div>

  <!-- Main grid layout -->
  <div id="app-grid">
    <section id="greeting-widget"></section>
    <section id="timer-widget"></section>
    <section id="todo-widget"></section>
    <section id="links-widget"></section>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
